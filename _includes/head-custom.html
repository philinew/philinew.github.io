<!-- Open every link in a new tab, except links back to the homepage and anchors within the current page.
     This also covers links that are added to README.md or mpwz.md later on. -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var links = document.querySelectorAll("a[href]");
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var url;
      try {
        url = new URL(a.getAttribute("href"), window.location.href);
      } catch (e) {
        continue;
      }
      if (url.protocol !== "http:" && url.protocol !== "https:") { continue; }
      var sameSite = url.host === window.location.host;
      var isHome = sameSite && (url.pathname === "/" || url.pathname === "/index.html");
      var isAnchorOnThisPage = sameSite && url.pathname === window.location.pathname && url.hash !== "";
      if (isHome || isAnchorOnThisPage) { continue; }
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    }
  });
</script>

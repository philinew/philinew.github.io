<!-- Links to other websites and to files (CV, PDFs) open in a new tab.
     Pages of this site (Research, Teaching, Events, /mpwz) and anchors stay in the same tab.
     This also covers links that are added to the Markdown pages later on. -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var links = document.querySelectorAll("a[href]");
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var url;
      try {
        url = new URL(a.getAttribute("href"), window.location.href);
      } catch (e) {
        continue;
      }
      if (url.protocol !== "http:" && url.protocol !== "https:") { continue; }
      var sameSite = url.host === window.location.host;
      var isFile = /\.[a-z0-9]{2,5}$/i.test(url.pathname) && !/\.html?$/i.test(url.pathname);
      if (sameSite && !isFile) { continue; }
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    }
  });
</script>
